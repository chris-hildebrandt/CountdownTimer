<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Countdown Bar</title>
<script>
// ======================= SETTINGS: edit here =======================
// Text, link, end time and colors. Times are wall-clock time in timeZone.
const CONFIG = {
  title:            "Sister Hildebrandt- CALLED to SERVE!",
  timerTitle:       "Be right back in....",
  buttonText:       "send her LOVE",
  buttonLink:       "https://chris-hildebrandt.github.io/missionary-email-redirect/",
  hideButtonOnDone: false,
  endsAt:           "2028-04-05T17:00",   // wall-clock time in timeZone
  timeZone:         "America/Boise",      // IANA name, e.g. "America/Sao_Paulo"
  lang:             "en",                 // language of the text above
  labels:           { days: "DAY", hours: "HR", minutes: "MIN", seconds: "SEC" },
  icon:             "alarm",             // Material Symbols icon, inlined as SVG; "none" hides it
  theme: {
    background: "#ffffff", tileBg: "#5fe0b0", tileText: "#134e42",
    labelText: "#1f6f5f", titleText: "#1d2a2a", timerTitleText: "#2b3a3a",
    buttonBg: "#0f6b4f", buttonText: "#ffffff"
  }
  // phase 2 adds: missionMonths (18), modes, style, styles, slides (section 9)
};
// ====================================================================
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
  :root {
    /* Opt out of forced/auto dark modes that would recolor the tiles. */
    color-scheme: only light;

    /* Theme defaults; CONFIG.theme overrides these at startup (camelCase -> --kebab-case). */
    --background: #ffffff;
    --tile-bg: #5fe0b0;
    --tile-text: #134e42;
    --label-text: #1f6f5f;
    --title-text: #1d2a2a;
    --timer-title-text: #2b3a3a;
    --button-bg: #0f6b4f;
    --button-text: #ffffff;
    /* Derived, not part of the theme. */
    --tile-split: rgb(255 255 255 / .35);
    --shadow: rgb(0 0 0 / .25);
    --hover-shade: rgb(0 0 0 / .08);

    --font: "Lora", Georgia, "Times New Roman", serif;
  }

  /* 1rem = title size. Every other size is in rem (or em of its own font-size),
     so one line per layout scales the bar. ≥900px: 20px at a ~1370px-wide bar. */
  html { font-size: clamp(15px, min(1.46vw, 14vh), 24px); }

  html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
  body {
    display: flex;
    align-items: center;
    font-family: var(--font);
    overflow: hidden;
  }

  .bar {
    box-sizing: border-box;
    width: 100%;
    display: grid;
    /* The columns line pairs with the areas line: keep them in step when reordering. */
    grid-template-areas: "title timer button";
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: .5rem 1rem;
    min-height: 6.15rem;
    padding: .6rem 4rem;
    background: var(--background);
    box-shadow: 0 12px 24px -12px var(--shadow);
  }

  .title {
    grid-area: title;
    justify-self: start;
    min-width: 0;
    display: flex;
    align-items: center;
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--title-text);
  }
  .title-icon { width: 1.25em; height: 1.25em; flex: none; margin-right: .35em; fill: currentColor; }
  .title-text { min-width: 0; text-wrap: balance; overflow-wrap: anywhere; }

  .timer {
    grid-area: timer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .timer-title {
    margin: 0 0 .2rem;
    font-size: .75rem;
    font-style: italic;
    font-weight: 400;
    line-height: 1.2;
    color: var(--timer-title-text);
  }

  .units { display: flex; align-items: flex-start; }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .tiles { display: flex; }
  .tile {
    position: relative;
    contain: layout paint;
    box-sizing: border-box;
    width: 1.25em;
    height: 1.6em;
    border-radius: 4px;
    background: var(--tile-bg);
    color: var(--tile-text);
    font-size: 1.2rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums lining-nums;
    line-height: 1.6em;
    text-align: center;
  }
  .tile + .tile { margin-left: .2rem; }
  /* Faint flip-card split line, as on the original. */
  .tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: var(--tile-split);
  }
  .colon {
    width: .92em;
    height: 1.6em;
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.45em;
    text-align: center;
    color: var(--title-text);
  }
  /* Zero-width flex box: a long label overflows its unit centered instead of widening it. */
  .unit-label {
    display: flex;
    justify-content: center;
    width: 0;
    white-space: nowrap;
    margin-top: .3rem;
    font-size: .6rem;
    letter-spacing: .08em;
    line-height: 1;
    color: var(--label-text);
  }

  .button {
    grid-area: button;
    justify-self: end;
    position: relative;
    box-sizing: border-box;
    max-width: 13em;
    padding: .5rem 1.05rem;
    border: 2px solid transparent;
    border-radius: 8px;
    background-color: var(--button-bg);
    color: var(--button-text);
    font-size: .85rem;
    font-weight: 600;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    text-wrap: balance;
    transition: background-color .15s ease;
  }
  /* Extends the hit area to at least 44px tall without growing the pill. */
  .button::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: max(100%, 44px);
    transform: translateY(-50%);
  }
  @media (hover: hover) {
    .button:hover { background-image: linear-gradient(var(--hover-shade), var(--hover-shade)); }
  }
  .button:focus-visible { outline: 3px solid var(--button-bg); outline-offset: 3px; }

  [hidden] { display: none !important; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* 600–899px: title and button on top, timer below. */
  @media (max-width: 899px) {
    html { font-size: clamp(12px, min(2.75vw, 10.5vh), 24px); }
    .bar {
      grid-template-areas: "title button" "timer timer";
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .55rem 1rem;
      padding: .6rem 1.5rem;
    }
    .timer { justify-self: center; }
  }

  /* <600px: timer on top, then a smaller title and button side by side. */
  @media (max-width: 599px) {
    html { font-size: clamp(10px, min(4.9vw, 14.5vh), 24px); }
    .bar {
      /* Outer 1fr spacer columns center the title+button pair; the spanning timer
         sizes against them, so it doesn't widen the button column. */
      grid-template-areas: "timer timer timer timer" ". title button .";
      grid-template-columns: minmax(0, 1fr) minmax(0, max-content) auto minmax(0, 1fr);
      gap: .35rem 0;
      padding: .3rem .5rem;
      min-height: 0;
    }
    .title-icon, .timer-title { display: none; }
    .title { font-size: .66rem; }
    .timer { justify-self: center; }
    .button { justify-self: start; margin-left: .6rem; font-size: .66rem; padding: .35rem .7rem; }
  }

  @media (forced-colors: active) {
    .tile { border: 1px solid CanvasText; }
  }

  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
  }
</style>
</head>
<body>
  <div class="bar">
    <p class="title">
      <!-- Material Symbols Outlined "alarm", wght 400, fill 0 (Google, Apache 2.0) -->
      <svg class="title-icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M480-80q-75 0-140.5-28.5t-114-77q-48.5-48.5-77-114T120-440q0-75 28.5-140.5t77-114q48.5-48.5 114-77T480-800q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-440q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-80Zm0-360Zm112 168 56-56-128-128v-184h-80v216l152 152ZM224-866l56 56-170 170-56-56 170-170Zm512 0 170 170-56 56-170-170 56-56ZM480-160q117 0 198.5-81.5T760-440q0-117-81.5-198.5T480-720q-117 0-198.5 81.5T200-440q0 117 81.5 198.5T480-160Z"/></svg>
      <span class="title-text">Sister Hildebrandt- CALLED to SERVE!</span>
    </p>

    <div class="timer" role="timer">
      <p class="timer-title">Be right back in....</p>
      <span class="timer-summary visually-hidden">528 days, 0 hours, 43 minutes</span>
      <div class="units" aria-hidden="true">
        <div class="unit unit--days" data-unit="days">
          <div class="tiles"><span class="tile">5</span><span class="tile">2</span><span class="tile">8</span></div>
          <span class="unit-label">DAY</span>
        </div>
        <span class="colon">:</span>
        <div class="unit unit--hours" data-unit="hours">
          <div class="tiles"><span class="tile">0</span><span class="tile">0</span></div>
          <span class="unit-label">HR</span>
        </div>
        <span class="colon">:</span>
        <div class="unit unit--minutes" data-unit="minutes">
          <div class="tiles"><span class="tile">4</span><span class="tile">3</span></div>
          <span class="unit-label">MIN</span>
        </div>
        <span class="colon">:</span>
        <div class="unit unit--seconds" data-unit="seconds">
          <div class="tiles"><span class="tile">5</span><span class="tile">5</span></div>
          <span class="unit-label">SEC</span>
        </div>
      </div>
    </div>

    <a class="button" href="https://chris-hildebrandt.github.io/missionary-email-redirect/" target="_blank" rel="noopener"><span class="button-text">send her LOVE</span><span class="visually-hidden"> (opens in new tab)</span></a>
  </div>

<script>
(function () {
  'use strict';
  // ES2017 only (no ?. or ??): an old iPad must be able to parse this.

  var root = document.documentElement;
  var bar = document.querySelector('.bar');

  function kebab(name) {
    return name.replace(/[A-Z]/g, function (c) { return '-' + c.toLowerCase(); });
  }

  function setText(selector, text) {
    var el = bar.querySelector(selector);
    if (!el) return null;
    el.textContent = text;
    return el;
  }

  function applyConfig(cfg) {
    if (cfg.lang) root.lang = cfg.lang;

    var theme = cfg.theme || {};
    Object.keys(theme).forEach(function (key) {
      root.style.setProperty('--' + kebab(key), theme[key]);
    });

    setText('.title-text', cfg.title);
    bar.querySelector('.title').hidden = !cfg.title;
    var icon = bar.querySelector('.title-icon');
    if (cfg.icon === 'none') {
      icon.parentNode.removeChild(icon);
    } else if (cfg.icon !== 'alarm') {
      console.warn('CONFIG.icon: only "alarm" or "none" are available; showing "alarm".');
    }

    setText('.timer-title', cfg.timerTitle).hidden = !cfg.timerTitle;

    var button = bar.querySelector('.button');
    setText('.button-text', cfg.buttonText);
    button.href = cfg.buttonLink;
    button.hidden = !cfg.buttonText;

    var labels = cfg.labels || {};
    Array.prototype.forEach.call(bar.querySelectorAll('.unit[data-unit]'), function (unit) {
      var label = labels[unit.getAttribute('data-unit')];
      if (label != null) unit.querySelector('.unit-label').textContent = label;
    });
  }

  applyConfig(CONFIG);
})();
</script>
</body>
</html>
